syntax = "proto3";

package C12S.AgentQueue;

option go_package = "github.com/c12s/agent_queue/pkg/api";

service AgentQueue {
  rpc DeseminateConfig(DeseminateConfigRequest) returns (DeseminateConfigResponse);
  rpc JoinCluster(JoinClusterRequest) returns (JoinClusterResponse);
  rpc DisseminateAppConfig(DeseminateConfigRequest) returns (DeseminateConfigResponse);
  rpc DisseminateOSImage(OSImageRequest) returns (OSImageResponse);
}

message OSImageRequest {
  string node_id = 1;
  string image_ref = 2;
  string digest = 3;
  string reboot_policy = 4;
  bool rollback = 5;
}

message OSImageResponse {
  bool accepted = 1;
}

message DeseminateConfigRequest {
  string node_id = 1;
  bytes config = 2;
  string webhook = 3;
}

message DeseminateConfigResponse {}

message JoinClusterRequest {
  string node_id = 1;
  string cluster_id = 2;
  string join_address = 3;
}

message JoinClusterResponse {}

message OSUpdateCmd {
  string image_ref = 1;
  string digest = 2;
  string reboot_policy = 3;
  bool rollback = 4;
}

message OSUpdateAck {}